spring.application.name=Veterinaria-backend

# Configuración con Variables de Entorno y valores de respaldo (fallback)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Esquema predeterminado
spring.jpa.properties.hibernate.default_schema=public

# Seguridad (JWT)
# JWT_SECRET: cadena larga y aleatoria (mínimo 32 caracteres). NUNCA va en el código ni en GitHub:
# se define como variable de entorno (IntelliJ en local, Variables en Railway).
app.jwt.secret=${JWT_SECRET}
# Duración del token en minutos (por defecto 8 horas)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
